<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" width="760" height="488" role="img" aria-label="Each link is shown, but no study has measured the whole path" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
